[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maimai-score-hub-ocr-api"
version = "0.1.0"
description = "Score Hub image recognition API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
pipeline = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "onnxruntime-gpu>=1.20,<2",
  "Pillow>=10,<13",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "ultralytics>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]
