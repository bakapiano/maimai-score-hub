openapi: 3.0.2
paths:
  /health:
    get:
      tags: &a1
        - app
      parameters: []
      operationId: app.getStatus
      responses:
        "200":
          description: "200"
  /statistics:
    get:
      tags: *a1
      parameters: []
      operationId: app.getStatistics
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  dxnetJobs:
                    type: object
                    properties:
                      totalCount:
                        type: integer
                        minimum: 0
                      completedCount:
                        type: integer
                        minimum: 0
                      failedCount:
                        type: integer
                        minimum: 0
                      successRate:
                        type: number
                      avgDuration:
                        type: number
                        nullable: true
                    required:
                      - totalCount
                      - completedCount
                      - failedCount
                      - successRate
                      - avgDuration
                required:
                  - dxnetJobs
  /auth/login-requests:
    post:
      tags: &a2
        - auth
      parameters: []
      operationId: auth.loginRequest
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                friendCode:
                  type: string
                  minLength: 1
                method:
                  type: string
                  enum:
                    - bot_sends_request
                    - user_sends_request
              required:
                - friendCode
                - method
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  authUrl:
                    type: string
                  authToken:
                    type: string
                  message:
                    type: string
                  reused:
                    type: boolean
                  botFriendCode:
                    type: string
                  createdAt:
                    type: string
                  job:
                    type: object
                    properties:
                      id:
                        type: string
                      jobType:
                        type: string
                        enum:
                          - send_friend_request
                          - accept_friend_request
                          - update_score
                          - get_full_friend_list
                      priority:
                        type: integer
                        minimum: 0
                        maximum: 4
                      botUserFriendCode:
                        type: string
                        nullable: true
                      friendRequestSentAt:
                        type: string
                        nullable: true
                      friendRequestWaitStartedAt:
                        type: string
                        nullable: true
                      status:
                        type: string
                        enum:
                          - queued
                          - processing
                          - completed
                          - failed
                          - canceled
                      stage:
                        type: string
                        enum:
                          - send_request
                          - wait_acceptance
                          - wait_user_request
                          - accept_request
                          - update_score
                          - get_full_friend_list
                      profile:
                        nullable: true
                      error:
                        type: string
                        nullable: true
                      errorCode:
                        type: string
                        enum:
                          - cabinet_bot_unavailable
                          - cabinet_friendship_failed
                          - cabinet_friendship_unconfirmed
                          - job_deadline_exceeded
                        nullable: true
                      scoreProgress:
                        type: object
                        properties:
                          completedDiffs:
                            type: array
                            items:
                              type: integer
                              minimum: 0
                              maximum: 14
                          totalDiffs:
                            type: integer
                            minimum: 0
                        required:
                          - completedDiffs
                          - totalDiffs
                        nullable: true
                      updateScoreDuration:
                        type: number
                        nullable: true
                      diffsToScrape:
                        type: array
                        items:
                          type: integer
                        nullable: true
                      musicIds:
                        type: array
                        items:
                          type: string
                        nullable: true
                      scoreFetchTargets:
                        type: array
                        items:
                          type: object
                          properties:
                            musicId:
                              type: string
                              minLength: 1
                            title:
                              type: string
                            type:
                              type: string
                              enum:
                                - standard
                                - dx
                                - utage
                            category:
                              type: string
                            diff:
                              type: integer
                              minimum: 0
                              maximum: 10
                            genre:
                              type: integer
                              nullable: true
                            level:
                              type: integer
                              minimum: 1
                              maximum: 23
                              nullable: true
                          required:
                            - musicId
                            - title
                            - type
                            - category
                            - diff
                            - genre
                            - level
                        nullable: true
                      fcfsOnly:
                        type: boolean
                      context:
                        type: object
                        additionalProperties: {}
                        nullable: true
                      runAt:
                        type: string
                        nullable: true
                      deadlineAt:
                        type: string
                        nullable: true
                      cabinetFriendshipStatus:
                        type: string
                        enum:
                          - not_required
                          - pending
                          - running
                          - ready
                          - uncertain
                          - failed
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      friendCode:
                        type: string
                        minLength: 1
                    required:
                      - id
                      - jobType
                      - status
                      - stage
                      - createdAt
                      - updatedAt
                      - friendCode
                required:
                  - jobId
                additionalProperties: true
  /auth/login-requests/{jobId}:
    get:
      tags: *a2
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      operationId: auth.loginStatus
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  done:
                    type: boolean
                  status:
                    type: string
                  friendCode:
                    type: string
                  message:
                    type: string
                additionalProperties: true
  /auth/login-requests/{jobId}/verify:
    post:
      tags: *a2
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      operationId: auth.verifyLoginRequest
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    type: object
                    properties:
                      id:
                        type: string
                      jobType:
                        type: string
                        enum:
                          - send_friend_request
                          - accept_friend_request
                          - update_score
                          - get_full_friend_list
                      priority:
                        type: integer
                        minimum: 0
                        maximum: 4
                      botUserFriendCode:
                        type: string
                        nullable: true
                      friendRequestSentAt:
                        type: string
                        nullable: true
                      friendRequestWaitStartedAt:
                        type: string
                        nullable: true
                      status:
                        type: string
                        enum:
                          - queued
                          - processing
                          - completed
                          - failed
                          - canceled
                      stage:
                        type: string
                        enum:
                          - send_request
                          - wait_acceptance
                          - wait_user_request
                          - accept_request
                          - update_score
                          - get_full_friend_list
                      profile:
                        nullable: true
                      error:
                        type: string
                        nullable: true
                      errorCode:
                        type: string
                        enum:
                          - cabinet_bot_unavailable
                          - cabinet_friendship_failed
                          - cabinet_friendship_unconfirmed
                          - job_deadline_exceeded
                        nullable: true
                      scoreProgress:
                        type: object
                        properties:
                          completedDiffs:
                            type: array
                            items:
                              type: integer
                              minimum: 0
                              maximum: 14
                          totalDiffs:
                            type: integer
                            minimum: 0
                        required:
                          - completedDiffs
                          - totalDiffs
                        nullable: true
                      updateScoreDuration:
                        type: number
                        nullable: true
                      diffsToScrape:
                        type: array
                        items:
                          type: integer
                        nullable: true
                      musicIds:
                        type: array
                        items:
                          type: string
                        nullable: true
                      scoreFetchTargets:
                        type: array
                        items:
                          type: object
                          properties:
                            musicId:
                              type: string
                              minLength: 1
                            title:
                              type: string
                            type:
                              type: string
                              enum:
                                - standard
                                - dx
                                - utage
                            category:
                              type: string
                            diff:
                              type: integer
                              minimum: 0
                              maximum: 10
                            genre:
                              type: integer
                              nullable: true
                            level:
                              type: integer
                              minimum: 1
                              maximum: 23
                              nullable: true
                          required:
                            - musicId
                            - title
                            - type
                            - category
                            - diff
                            - genre
                            - level
                        nullable: true
                      fcfsOnly:
                        type: boolean
                      context:
                        type: object
                        additionalProperties: {}
                        nullable: true
                      runAt:
                        type: string
                        nullable: true
                      deadlineAt:
                        type: string
                        nullable: true
                      cabinetFriendshipStatus:
                        type: string
                        enum:
                          - not_required
                          - pending
                          - running
                          - ready
                          - uncertain
                          - failed
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      friendCode:
                        type: string
                        minLength: 1
                    required:
                      - id
                      - jobType
                      - status
                      - stage
                      - createdAt
                      - updatedAt
                      - friendCode
                required:
                  - job
  /auth/qr-login:
    post:
      tags: *a2
      parameters: []
      operationId: auth.loginByQr
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                qrCode:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - fast
                      token:
                        type: string
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          friendCode:
                            type: string
                          username:
                            type: string
                            nullable: true
                        required:
                          - friendCode
                        additionalProperties: true
                    required:
                      - kind
                      - token
                      - user
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - async
                      attemptId:
                        type: string
                    required:
                      - kind
                      - attemptId
        "400":
          description: "400"
        "404":
          description: "404"
        "409":
          description: "409"
  /auth/qr-login/{attemptId}:
    get:
      tags: *a2
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      operationId: auth.pollLoginByQr
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  attemptId:
                    type: string
                  status:
                    type: string
                    enum:
                      - pending
                      - adding_rival
                      - waiting_snapshot
                      - matched
                      - failed
                  token:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      friendCode:
                        type: string
                      username:
                        type: string
                        nullable: true
                    required:
                      - friendCode
                    additionalProperties: true
                required:
                  - attemptId
                  - status
                  - token
                  - error
        "400":
          description: "400"
        "404":
          description: "404"
  /auth/password-login:
    post:
      tags: *a2
      parameters: []
      operationId: auth.passwordLogin
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                friendCode:
                  type: string
                  pattern: ^\d{15}$
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: ^[A-Za-z0-9_]+$
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - password
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      friendCode:
                        type: string
                      username:
                        type: string
                        nullable: true
                    required:
                      - friendCode
                    additionalProperties: true
                required:
                  - token
                  - user
        "400":
          description: "400"
        "401":
          description: "401"
  /auth/passkey/options:
    post:
      tags: *a2
      parameters: []
      operationId: auth.passkeyOptions
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ceremonyId:
                    type: string
                    format: uuid
                  options:
                    type: object
                    additionalProperties: {}
                required:
                  - ceremonyId
                  - options
        "429":
          description: "429"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
  /auth/passkey/verify:
    post:
      tags: *a2
      parameters: []
      operationId: auth.passkeyVerify
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                ceremonyId:
                  type: string
                  format: uuid
                response:
                  type: object
                  additionalProperties: {}
              required:
                - ceremonyId
                - response
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      friendCode:
                        type: string
                      username:
                        type: string
                        nullable: true
                    required:
                      - friendCode
                    additionalProperties: true
                required:
                  - token
                  - user
        "400":
          description: "400"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
        "401":
          description: "401"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
        "429":
          description: "429"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
  /me:
    get:
      tags: &a3
        - users
      parameters: []
      operationId: users.profile
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  friendCode:
                    type: string
                  username:
                    type: string
                    nullable: true
                  hasPassword:
                    type: boolean
                  hasDivingFishImportToken:
                    type: boolean
                  hasLxnsImportToken:
                    type: boolean
                  profile:
                    nullable: true
                  hasCabinetUserId:
                    type: boolean
                  autoUpdate:
                    type: boolean
                required:
                  - id
                  - friendCode
                additionalProperties: true
    patch:
      tags: *a3
      parameters: []
      operationId: users.updateProfile
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                divingFishImportToken:
                  type: string
                  nullable: true
                lxnsImportToken:
                  type: string
                  nullable: true
                autoUpdate:
                  type: boolean
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  friendCode:
                    type: string
                  username:
                    type: string
                    nullable: true
                  hasPassword:
                    type: boolean
                  hasDivingFishImportToken:
                    type: boolean
                  hasLxnsImportToken:
                    type: boolean
                  profile:
                    nullable: true
                  hasCabinetUserId:
                    type: boolean
                  autoUpdate:
                    type: boolean
                required:
                  - id
                  - friendCode
                additionalProperties: true
    delete:
      tags: *a3
      parameters: []
      operationId: users.deleteMe
      responses:
        "200":
          description: "200"
  /me/password:
    put:
      tags: *a3
      parameters: []
      operationId: users.setPassword
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: ^[A-Za-z0-9_]+$
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 72
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  friendCode:
                    type: string
                  username:
                    type: string
                    nullable: true
                  hasPassword:
                    type: boolean
                  hasDivingFishImportToken:
                    type: boolean
                  hasLxnsImportToken:
                    type: boolean
                  profile:
                    nullable: true
                  hasCabinetUserId:
                    type: boolean
                  autoUpdate:
                    type: boolean
                required:
                  - id
                  - friendCode
                additionalProperties: true
        "400":
          description: "400"
        "401":
          description: "401"
        "409":
          description: "409"
  /me/passkeys:
    get:
      tags: *a3
      parameters: []
      operationId: users.listPasskeys
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    transports:
                      type: array
                      items:
                        type: string
                    deviceType:
                      type: string
                      enum:
                        - singleDevice
                        - multiDevice
                    backedUp:
                      type: boolean
                    createdAt:
                      type: string
                    lastUsedAt:
                      type: string
                      nullable: true
                  required:
                    - id
                    - name
                    - transports
                    - deviceType
                    - backedUp
                    - createdAt
                    - lastUsedAt
        "401":
          description: "401"
  /me/passkeys/registration/options:
    post:
      tags: *a3
      parameters: []
      operationId: users.createPasskeyOptions
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 72
              required:
                - password
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ceremonyId:
                    type: string
                    format: uuid
                  options:
                    type: object
                    additionalProperties: {}
                required:
                  - ceremonyId
                  - options
        "403":
          description: "403"
        "409":
          description: "409"
        "429":
          description: "429"
  /me/passkeys/registration/verify:
    post:
      tags: *a3
      parameters: []
      operationId: users.verifyPasskeyRegistration
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                ceremonyId:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                response:
                  type: object
                  additionalProperties: {}
              required:
                - ceremonyId
                - name
                - response
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  transports:
                    type: array
                    items:
                      type: string
                  deviceType:
                    type: string
                    enum:
                      - singleDevice
                      - multiDevice
                  backedUp:
                    type: boolean
                  createdAt:
                    type: string
                  lastUsedAt:
                    type: string
                    nullable: true
                required:
                  - id
                  - name
                  - transports
                  - deviceType
                  - backedUp
                  - createdAt
                  - lastUsedAt
        "400":
          description: "400"
        "409":
          description: "409"
  /me/passkeys/{id}:
    patch:
      tags: *a3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      operationId: users.renamePasskey
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
              required:
                - name
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  transports:
                    type: array
                    items:
                      type: string
                  deviceType:
                    type: string
                    enum:
                      - singleDevice
                      - multiDevice
                  backedUp:
                    type: boolean
                  createdAt:
                    type: string
                  lastUsedAt:
                    type: string
                    nullable: true
                required:
                  - id
                  - name
                  - transports
                  - deviceType
                  - backedUp
                  - createdAt
                  - lastUsedAt
        "404":
          description: "404"
  /me/passkeys/{id}/delete:
    post:
      tags: *a3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      operationId: users.deletePasskey
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 72
              required:
                - password
      responses:
        "200":
          description: "200"
        "403":
          description: "403"
        "404":
          description: "404"
        "429":
          description: "429"
  /me/prober-tokens/diving-fish:
    post:
      tags: *a3
      parameters: []
      operationId: users.getDivingFishToken
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
              required:
                - username
                - password
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  importToken:
                    type: string
                  message:
                    type: string
                additionalProperties: true
  /me/cabinet:
    put:
      tags: *a3
      parameters: []
      operationId: users.bindCabinetQr
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                qrCode:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        "202":
          description: "202"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  pending:
                    type: boolean
                    enum:
                      - true
                  attemptId:
                    type: string
                required:
                  - ok
                  - pending
                  - attemptId
        "400":
          description: "400"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  verification:
                    type: string
                    enum:
                      - scores
                      - profile
                  matchedRows:
                    type: integer
                    minimum: 0
                  requiredRows:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: 0
                    nullable: true
                required:
                  - error
                  - verification
                  - matchedRows
                  - requiredRows
    delete:
      tags: *a3
      parameters: []
      operationId: users.unbindCabinet
