name: deploy frontend

on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-frontend.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Package static release
        run: |
          tar -czf /tmp/maimai-score-hub-frontend-${GITHUB_SHA}.tgz \
            -C frontend/dist .
          ls -lh /tmp/maimai-score-hub-frontend-${GITHUB_SHA}.tgz

      - name: Upload static release
        timeout-minutes: 8
        env:
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          FRONTEND_USER: ${{ secrets.FRONTEND_USER }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          FRONTEND_PORT="${FRONTEND_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/frontend_deploy_key
          chmod 600 ~/.ssh/frontend_deploy_key
          timeout 30s ssh-keyscan -p "$FRONTEND_PORT" "$FRONTEND_HOST" >> ~/.ssh/known_hosts
          uploaded=0
          for attempt in 1 2 3; do
            if timeout 120s ssh -C -o IdentitiesOnly=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
              -p "$FRONTEND_PORT" -i ~/.ssh/frontend_deploy_key \
              "$FRONTEND_USER@$FRONTEND_HOST" \
              "cat > /tmp/maimai-score-hub-frontend-${GITHUB_SHA}.tgz" \
              < /tmp/maimai-score-hub-frontend-${GITHUB_SHA}.tgz; then
              uploaded=1
              break
            fi
            echo "Upload attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          test "$uploaded" -eq 1

      - name: Activate static release
        timeout-minutes: 10
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          port: ${{ secrets.FRONTEND_PORT }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            WEB_ROOT="${{ secrets.FRONTEND_PATH }}"
            ARCHIVE="/tmp/maimai-score-hub-frontend-${{ github.sha }}.tgz"
            RELEASE="${{ github.sha }}"
            RELEASE_DIR="$WEB_ROOT/frontend-releases/$RELEASE"
            INCOMING="$WEB_ROOT/frontend-releases/.incoming-$RELEASE"

            test -n "$WEB_ROOT"
            test -f "$ARCHIVE"
            install -d -m 755 "$WEB_ROOT/frontend-releases"
            rm -rf -- "$INCOMING"
            install -d -m 755 "$INCOMING"
            tar -xzf "$ARCHIVE" -C "$INCOMING"
            test -s "$INCOMING/index.html"
            chmod -R a+rX "$INCOMING"

            if [ -d "$RELEASE_DIR" ]; then
              rm -rf -- "$INCOMING"
            else
              mv "$INCOMING" "$RELEASE_DIR"
            fi

            test -s "$RELEASE_DIR/index.html"
            rm -f -- "$WEB_ROOT/frontend-current.next"
            ln -s "frontend-releases/$RELEASE" "$WEB_ROOT/frontend-current.next"
            mv -Tf "$WEB_ROOT/frontend-current.next" "$WEB_ROOT/frontend-current"
            printf '%s\n' "$RELEASE" > "$WEB_ROOT/.frontend-revision"
            rm -f -- "$ARCHIVE"

            nginx -t
            curl --resolve maiscorehub.bakapiano.com:443:127.0.0.1 \
              -fsS https://maiscorehub.bakapiano.com/ >/dev/null
            curl --resolve maimai.bakapiano.com:443:127.0.0.1 \
              -fsS https://maimai.bakapiano.com/ >/dev/null
            echo "Frontend static release activated: $RELEASE"
