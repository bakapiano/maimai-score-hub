name: deploy worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Worker instance to deploy
        required: true
        type: choice
        default: all
        options: [all, "1", "2", "3", "4"]

jobs:
  build:
    uses: ./.github/workflows/build-worker.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        instance: ${{ fromJSON(inputs.target == 'all' && '[1,2,3,4]' || format('[{0}]', inputs.target)) }}
      fail-fast: false # 一个失败不影响其他部署
      max-parallel: 4 # 同时部署的最大数量
    concurrency:
      group: deploy-worker-${{ matrix.instance }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        run: |
          tar -czf /tmp/maimai-score-hub-worker-${GITHUB_SHA}.tgz \
            worker shared
          ls -lh /tmp/maimai-score-hub-worker-${GITHUB_SHA}.tgz

      - name: Upload source archive to Worker Instance ${{ matrix.instance }}
        timeout-minutes: 35
        env:
          DEPLOY_HOST: ${{ secrets[format('WORKER_{0}_HOST', matrix.instance)] }}
          DEPLOY_USER: ${{ secrets[format('WORKER_{0}_USER', matrix.instance)] }}
          DEPLOY_PORT: ${{ secrets[format('WORKER_{0}_PORT', matrix.instance)] }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          bash .github/scripts/upload-deploy-archive.sh \
            "/tmp/maimai-score-hub-worker-${GITHUB_SHA}.tgz" \
            "/tmp/maimai-score-hub-worker-${GITHUB_SHA}.tgz"

      - name: Deploy to Worker Instance ${{ matrix.instance }}
        timeout-minutes: 30
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          API_SHARED_SECRET: ${{ secrets.API_SHARED_SECRET }}
          HTTP_PROXY_PASSWORD: ${{ secrets.HTTP_PROXY_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          WORKER_JOB_SERVICE_BASE_URL: ${{ secrets.WORKER_JOB_SERVICE_BASE_URL }}
        with:
          host: ${{ secrets[format('WORKER_{0}_HOST', matrix.instance)] }}
          username: ${{ secrets[format('WORKER_{0}_USER', matrix.instance)] }}
          # WORKER_N_PORT is optional; appleboy/ssh-action falls back to 22.
          port: ${{ secrets[format('WORKER_{0}_PORT', matrix.instance)] }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          envs: ADMIN_PASSWORD,API_SHARED_SECRET,HTTP_PROXY_PASSWORD,REDIS_PASSWORD,REDIS_HOST,WORKER_JOB_SERVICE_BASE_URL
          script: |
            DEPLOY_PATH="${{ secrets[format('WORKER_{0}_PATH', matrix.instance)] }}"
            SOURCE_ARCHIVE="/tmp/maimai-score-hub-worker-${{ github.sha }}.tgz"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "❌ WORKER_${{ matrix.instance }}_PATH secret is required"
              exit 1
            fi
            if [ -z "${REDIS_HOST:-}" ]; then
              echo "❌ REDIS_HOST secret is required"
              exit 1
            fi
            if [ -z "${WORKER_JOB_SERVICE_BASE_URL:-}" ]; then
              echo "❌ WORKER_JOB_SERVICE_BASE_URL secret is required"
              exit 1
            fi
            if [ -z "${HTTP_PROXY_PASSWORD:-}" ]; then
              echo "❌ HTTP_PROXY_PASSWORD secret is required"
              exit 1
            fi
            if [ ! -f "$SOURCE_ARCHIVE" ]; then
              echo "❌ Source archive not found: $SOURCE_ARCHIVE"
              exit 1
            fi

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            sudo chown -R "$USER:$USER" "$(pwd)" || true

            RUNTIME_DIR="$(mktemp -d)"
            if [ -f worker/.env ]; then
              mkdir -p "$RUNTIME_DIR/worker"
              cp -a worker/.env "$RUNTIME_DIR/worker/.env"
            fi
            if [ -d worker/debug-html ]; then
              mkdir -p "$RUNTIME_DIR/worker"
              cp -a worker/debug-html "$RUNTIME_DIR/worker/debug-html"
            fi
            if [ -d worker/data ]; then
              mkdir -p "$RUNTIME_DIR/worker"
              cp -a worker/data "$RUNTIME_DIR/worker/data"
            fi

            rm -rf worker shared
            tar -xzf "$SOURCE_ARCHIVE" -C "$DEPLOY_PATH"
            rm -f "$SOURCE_ARCHIVE"
            if [ -f "$RUNTIME_DIR/worker/.env" ]; then
              cp -a "$RUNTIME_DIR/worker/.env" worker/.env
            fi
            if [ -d "$RUNTIME_DIR/worker/debug-html" ]; then
              rm -rf worker/debug-html
              cp -a "$RUNTIME_DIR/worker/debug-html" worker/debug-html
            fi
            if [ -d "$RUNTIME_DIR/worker/data" ]; then
              rm -rf worker/data
              cp -a "$RUNTIME_DIR/worker/data" worker/data
            fi
            rm -rf "$RUNTIME_DIR"

            upsert_env() {
              local key="$1"
              local value="$2"
              local file="worker/.env"
              if [ -z "$value" ]; then
                return 0
              fi
              touch "$file"
              local tmp
              tmp="$(mktemp)"
              awk -v key="$key" -v value="$value" '
                BEGIN { done = 0 }
                $0 ~ "^" key "=" { print key "=" value; done = 1; next }
                { print }
                END { if (!done) print key "=" value }
              ' "$file" > "$tmp"
              mv "$tmp" "$file"
              chmod 600 "$file"
            }
            upsert_env ADMIN_PASSWORD "${ADMIN_PASSWORD:-}"
            upsert_env API_SHARED_SECRET "${API_SHARED_SECRET:-${ADMIN_PASSWORD:-}}"
            upsert_env HTTP_PROXY_PASSWORD "${HTTP_PROXY_PASSWORD:-}"
            upsert_env REDIS_PASSWORD "${REDIS_PASSWORD:-${ADMIN_PASSWORD:-}}"
            upsert_env REDIS_HOST "${REDIS_HOST:-}"
            upsert_env REDIS_PORT "6379"
            upsert_env REDIS_DB "0"
            upsert_env REDIS_KEY_PREFIX "maimai:"
            upsert_env BULLMQ_PREFIX ""
            upsert_env NODE_ENV "production"
            upsert_env JOB_SERVICE_BASE_URL "${WORKER_JOB_SERVICE_BASE_URL:-}"
            upsert_env DXNET_WORKER_CONCURRENCY "16"
            upsert_env MAX_PROCESS_JOBS "16"
            upsert_env DXNET_WORKER_REVISION "${{ github.sha }}"
            upsert_env DXNET_LANE_INTERACTIVE_CONCURRENCY "8"
            upsert_env DXNET_LANE_USER_SYNC_CONCURRENCY "16"
            upsert_env DXNET_LANE_BACKGROUND_CONCURRENCY "16"
            if [ "${{ matrix.instance }}" = "4" ]; then
              upsert_env WORKER_ID "dxnet-worker-azure-bot4"
            fi
            printf '%s\n' "${{ github.sha }}" > "$DEPLOY_PATH/.deploy-revision"

            # Worker 3 (101) has no public IP and goes through a great-firewall
            # constrained link; route docker pulls through the host's clash proxy.
            # The proxy lives on the host's loopback so daemon already has it
            # via /etc/systemd/system/docker.service.d/*.conf — but build-time
            # network calls (npm install, apt) still need these env vars.
            EXTRA_ENV=""
            if [ "${{ matrix.instance }}" = "3" ]; then
              EXTRA_ENV="HTTP_PROXY=http://127.0.0.1:7890 HTTPS_PROXY=http://127.0.0.1:7890 NO_PROXY=localhost,127.0.0.1"
            fi
            # Cap docker build cache before build to avoid ENOSPC
            sudo docker builder prune --force --keep-storage=2GB || true
            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose -f worker/docker-compose.yml"
            else
              COMPOSE_CMD="docker compose -f worker/docker-compose.yml"
            fi
            sudo env $EXTRA_ENV \
              ADMIN_PASSWORD="${ADMIN_PASSWORD:-}" \
              API_SHARED_SECRET="${API_SHARED_SECRET:-${ADMIN_PASSWORD:-}}" \
              HTTP_PROXY_PASSWORD="${HTTP_PROXY_PASSWORD:-}" \
              REDIS_PASSWORD="${REDIS_PASSWORD:-${ADMIN_PASSWORD:-}}" \
              REDIS_HOST="${REDIS_HOST:-}" \
              REDIS_PORT="6379" \
              REDIS_DB="0" \
              REDIS_KEY_PREFIX="maimai:" \
              BULLMQ_PREFIX="" \
              NODE_ENV="production" \
              JOB_SERVICE_BASE_URL="${WORKER_JOB_SERVICE_BASE_URL:-}" \
              DXNET_WORKER_CONCURRENCY="16" \
              MAX_PROCESS_JOBS="16" \
              $COMPOSE_CMD up -d --build || exit 1
            sudo docker image prune -f
            # Cap docker build cache so disks don't fill up
            sudo docker builder prune --force --keep-storage=2GB || true
            for i in $(seq 1 36); do
              CONTAINER_ID="$(sudo $COMPOSE_CMD ps -q worker)"
              RESTART_COUNT="$(sudo docker inspect --format '{{.RestartCount}}' "$CONTAINER_ID" 2>/dev/null || echo 1)"
              if [ "$RESTART_COUNT" != "0" ]; then
                echo "Worker RestartCount=$RESTART_COUNT; waiting for a clean container"
                sleep 5
                continue
              fi
              HEALTH_JSON="$(curl -fsS http://localhost:3999/api/health || true)"
              BOT_FLEET_JSON="$(curl -fsS -H "X-API-Secret: ${API_SHARED_SECRET:-${ADMIN_PASSWORD:-}}" "${WORKER_JOB_SERVICE_BASE_URL%/}/api/v1/admin/bots" || true)"
              if [ -n "$HEALTH_JSON" ] && [ -n "$BOT_FLEET_JSON" ] && HEALTH_JSON="$HEALTH_JSON" BOT_FLEET_JSON="$BOT_FLEET_JSON" EXPECTED_REVISION="${{ github.sha }}" python3 -c 'import json, os, sys; h=json.loads(os.environ["HEALTH_JSON"]); d=h.get("dxnet") or {}; fc=d.get("botFriendCode"); lanes=tuple(lane.replace(chr(95),chr(45)) for lane in ("interactive","user_sync","background")); expected=({f"dxnet-shared-{lane}-jobs" for lane in lanes} | {f"dxnet-worker-{fc}-{lane}-jobs" for lane in lanes}) if fc else set(); ready=set(d.get("consumersReady") or []); age=d.get("snapshotAgeMs"); rss=d.get("rssPercent"); revision=os.environ["EXPECTED_REVISION"]; local_ok=h.get("status")=="ok" and d.get("revision")==revision and ready==expected and isinstance(age,(int,float)) and age<=300000 and isinstance(rss,(int,float)) and rss<70; bots=json.loads(os.environ["BOT_FLEET_JSON"]); remote_ok=any(b.get("friendCode")==fc and b.get("workerId")==d.get("workerId") and b.get("revision")==revision and b.get("available") is True and set(b.get("consumersReady") or [])==expected for b in bots); sys.exit(0 if local_ok and remote_ok else 1)'; then
                echo "$HEALTH_JSON"
                echo "Health check passed on instance ${{ matrix.instance }}"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 5 seconds..."
              sleep 5
            done
            echo "Health check failed after 36 attempts on instance ${{ matrix.instance }}"
            exit 1
