name: deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-backend.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        run: |
          tar -czf /tmp/maimai-score-hub-backend-${GITHUB_SHA}.tgz \
            --exclude=.git \
            --exclude='**/node_modules' \
            --exclude='backend/.env' \
            --exclude='backend/covers' \
            .

      - name: Upload source archive
        env:
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          BACKEND_USER: ${{ secrets.BACKEND_USER }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          BACKEND_PORT="${BACKEND_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/backend_deploy_key
          chmod 600 ~/.ssh/backend_deploy_key
          ssh-keyscan -p "$BACKEND_PORT" "$BACKEND_HOST" >> ~/.ssh/known_hosts
          scp -P "$BACKEND_PORT" -i ~/.ssh/backend_deploy_key \
            /tmp/maimai-score-hub-backend-${GITHUB_SHA}.tgz \
            "$BACKEND_USER@$BACKEND_HOST:/tmp/maimai-score-hub-backend-${GITHUB_SHA}.tgz"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USER }}
          port: ${{ secrets.BACKEND_PORT }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            DEPLOY_PATH="${{ secrets.BACKEND_PATH }}"
            SOURCE_ARCHIVE="/tmp/maimai-score-hub-backend-${{ github.sha }}.tgz"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "❌ BACKEND_PATH secret is required"
              exit 1
            fi
            if [ ! -f "$SOURCE_ARCHIVE" ]; then
              echo "❌ Source archive not found: $SOURCE_ARCHIVE"
              exit 1
            fi

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            sudo chown -R "$USER:$USER" "$(pwd)" || true
            tar -xzf "$SOURCE_ARCHIVE" -C "$DEPLOY_PATH"
            rm -f "$SOURCE_ARCHIVE"
            printf '%s\n' "${{ github.sha }}" > "$DEPLOY_PATH/.deploy-revision"

            # Build new image
            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              COMPOSE_CMD="docker compose"
            fi

            cd backend
            # Cap docker build cache BEFORE build (backend host has a
            # limited disk; without this we can hit ENOSPC mid-build, which then
            # silently rebuilds from a stale layer or restarts the old
            # image — masking failures as "success").
            sudo docker builder prune --force --keep-storage=2GB || true
            sudo $COMPOSE_CMD build || { echo "❌ Build failed"; exit 1; }

            # ── Zero-downtime rolling update ────────────────────────
            # We keep 2 replicas behind nginx. To avoid the brief
            # 502 window the previous "scale=2 --force-recreate"
            # caused (both replicas down at the same time), we:
            #   1. scale 2→3 (the new container picks up the freshly-
            #      built image; old 2 keep serving),
            #   2. wait for the new container to report healthy,
            #   3. scale back to 2 (compose drops the oldest container
            #      first; SIGTERM gives 60s grace via stop_grace_period
            #      so in-flight requests drain),
            #   4. repeat once more so the second old container is also
            #      replaced.
            # nginx is configured with resolver+variable proxy_pass +
            # proxy_next_upstream so any single-replica blip during
            # the swap is invisible to clients.

            wait_until_all_healthy() {
              local target_n="$1"
              for i in $(seq 1 30); do
                local healthy
                healthy=$(sudo $COMPOSE_CMD ps backend --format json 2>/dev/null \
                  | grep -c '"Health":"healthy"' || true)
                # Fallback for older compose versions whose --format json
                # doesn't include Health: count via classic ps.
                if [ "$healthy" -eq 0 ]; then
                  healthy=$(sudo $COMPOSE_CMD ps backend 2>/dev/null \
                    | grep -c "(healthy)" || true)
                fi
                echo "[wait] healthy=$healthy / target=$target_n (attempt $i/30)"
                if [ "$healthy" -ge "$target_n" ]; then
                  return 0
                fi
                sleep 5
              done
              return 1
            }

            roll_one_replica() {
              echo "── rolling one replica ──"
              # Step A: bring up an extra container with the new image.
              # --no-recreate keeps the existing 2 alive; the 3rd is
              # built from the freshly-built image we made above.
              sudo $COMPOSE_CMD up -d --no-deps --no-recreate --scale backend=3 backend
              echo "Waiting for 3 healthy backend containers..."
              if ! wait_until_all_healthy 3; then
                echo "❌ New replica did not become healthy within 150s"
                sudo $COMPOSE_CMD logs --tail=100 backend
                exit 1
              fi
              # Step B: explicitly stop the OLDEST container (by
              # creation time). compose's own scale-down picks the
              # highest-numbered container, which is the NEW one we
              # just added — exactly the opposite of what we want.
              # Sort by .Created ascending and pick the first.
              local oldest_id
              oldest_id=$(sudo $COMPOSE_CMD ps -q backend \
                | xargs -r sudo docker inspect \
                    --format '{{.Created}} {{.Id}}' \
                | sort \
                | head -1 \
                | awk '{print $2}')
              if [ -z "$oldest_id" ]; then
                echo "❌ Could not identify oldest container"
                exit 1
              fi
              echo "Stopping oldest container $oldest_id (graceful, up to 60s)..."
              sudo docker stop --time=60 "$oldest_id"
              sudo docker rm "$oldest_id"
              # compose now has 2 containers; sync desired-state to
              # avoid stale runtime metadata.
              sudo $COMPOSE_CMD up -d --no-deps --no-recreate --scale backend=2 backend
              echo "Scaled back to 2; waiting for new state to settle..."
              sleep 5
              if ! wait_until_all_healthy 2; then
                echo "❌ After scale-down, fewer than 2 healthy"
                sudo $COMPOSE_CMD logs --tail=100 backend
                exit 1
              fi
            }

            # Clean up any unhealthy containers from previous failed deployments
            UNHEALTHY_IDS=$(sudo $COMPOSE_CMD ps -q backend | xargs -r sudo docker inspect --format '{{if eq .State.Health.Status "unhealthy"}}{{.Id}}{{end}}' | grep -v '^$' || true)
            if [ -n "$UNHEALTHY_IDS" ]; then
              echo "Removing leftover unhealthy containers: $UNHEALTHY_IDS"
              echo "$UNHEALTHY_IDS" | xargs -r sudo docker rm -f
            fi

            # Replace replica #1, then #2.
            roll_one_replica
            roll_one_replica

            # Final state check via nginx (the public path users hit)
            for i in 1 2 3 4 5; do
              if curl -fsS http://localhost:8090/api/health; then
                echo "✅ Deployment successful — rolling complete"
                sudo $COMPOSE_CMD ps backend
                # Clean up dangling images
                sudo docker image prune -f
                # Cap docker build cache so the disk doesn't fill up.
                # The backend host has a limited disk, and BuildKit cache
                # can grow enough to break later deployments.
                sudo docker builder prune --force --keep-storage=2GB || true
                exit 0
              fi
              echo "Final health check attempt $i failed, retrying..."
              sleep 5
            done
            echo "❌ Final nginx health check failed"
            sudo $COMPOSE_CMD logs --tail=100 backend
            exit 1
