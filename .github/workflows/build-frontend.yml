name: build frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "shared/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "shared/**"
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install shared dependencies
        run: npm --prefix ../shared install

      - name: Build shared package
        run: npm --prefix ../shared run build

      - name: Install dependencies
        run: npm install --install-links=true

      # - name: Lint
      #   run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify Digital Asset Links
        run: |
          test -s dist/.well-known/assetlinks.json
          node -e "JSON.parse(require('fs').readFileSync('dist/.well-known/assetlinks.json', 'utf8'))"

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
