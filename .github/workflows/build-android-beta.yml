name: build Android Beta

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Beta signing key
        shell: bash
        env:
          ANDROID_BETA_KEYSTORE_BASE64: ${{ secrets.ANDROID_BETA_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_BETA_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_BETA_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/maiscorehub-beta.jks"
          chmod 600 "$RUNNER_TEMP/maiscorehub-beta.jks"

      - name: Test and build Beta APK
        shell: bash
        env:
          ANDROID_BETA_KEYSTORE_PATH: ${{ runner.temp }}/maiscorehub-beta.jks
          ANDROID_BETA_STORE_PASSWORD: ${{ secrets.ANDROID_BETA_STORE_PASSWORD }}
          ANDROID_BETA_KEY_ALIAS: ${{ secrets.ANDROID_BETA_KEY_ALIAS }}
          ANDROID_BETA_KEY_PASSWORD: ${{ secrets.ANDROID_BETA_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_BETA_STORE_PASSWORD"
          test -n "$ANDROID_BETA_KEY_ALIAS"
          test -n "$ANDROID_BETA_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew testDebugUnitTest testBetaUnitTest assembleBeta --no-daemon

      - name: Verify package, signing certificate and checksum
        id: verify
        shell: bash
        env:
          EXPECTED_CERT_SHA256: a6a19133d00559cab88dafd0b4a22f9afdf0cb69b638412b0c8e1d74e8b2e69e
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/beta/MaiScoreHub-beta.apk"
          test -s "$APK"
          APP_ID="$(apkanalyzer manifest application-id "$APK")"
          test "$APP_ID" = "com.bakapiano.maiscorehub.android.beta"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_CERT_SHA256="$(
            "$APKSIGNER" verify --print-certs "$APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          )"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          sha256sum "$APK" | tee "${APK}.sha256"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "application_id=${APP_ID}"
            echo "certificate_sha256=${ACTUAL_CERT_SHA256}"
          } > "app/build/outputs/apk/beta/build-info.txt"

      - name: Upload Beta APK
        uses: actions/upload-artifact@v7
        with:
          name: MaiScoreHub-beta
          path: |
            android-app/app/build/outputs/apk/beta/MaiScoreHub-beta.apk
            android-app/app/build/outputs/apk/beta/MaiScoreHub-beta.apk.sha256
            android-app/app/build/outputs/apk/beta/build-info.txt
          if-no-files-found: error
          retention-days: 30
