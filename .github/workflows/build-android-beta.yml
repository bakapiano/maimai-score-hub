name: build Android Beta

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-beta.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this signed Beta through the Backend release registry
        required: true
        type: boolean
        default: false
      mandatory:
        description: Mark this release as an important update
        required: true
        type: boolean
        default: false
      rollout_percent:
        description: Deterministic rollout percentage (0-100)
        required: true
        type: number
        default: 100
      notes:
        description: Website-visible release notes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-android-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Beta signing key
        shell: bash
        env:
          ANDROID_BETA_KEYSTORE_BASE64: ${{ secrets.ANDROID_BETA_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_BETA_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_BETA_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/maiscorehub-beta.jks"
          chmod 600 "$RUNNER_TEMP/maiscorehub-beta.jks"

      - name: Test and build Beta APK
        shell: bash
        env:
          ANDROID_BETA_KEYSTORE_PATH: ${{ runner.temp }}/maiscorehub-beta.jks
          ANDROID_BETA_STORE_PASSWORD: ${{ secrets.ANDROID_BETA_STORE_PASSWORD }}
          ANDROID_BETA_KEY_ALIAS: ${{ secrets.ANDROID_BETA_KEY_ALIAS }}
          ANDROID_BETA_KEY_PASSWORD: ${{ secrets.ANDROID_BETA_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_BETA_STORE_PASSWORD"
          test -n "$ANDROID_BETA_KEY_ALIAS"
          test -n "$ANDROID_BETA_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew testDebugUnitTest testBetaUnitTest assembleBeta --no-daemon

      - name: Verify package, signing certificate and checksum
        id: verify
        shell: bash
        env:
          EXPECTED_CERT_SHA256: a6a19133d00559cab88dafd0b4a22f9afdf0cb69b638412b0c8e1d74e8b2e69e
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/beta/MaiScoreHub-beta.apk"
          test -s "$APK"
          APP_ID="$(apkanalyzer manifest application-id "$APK")"
          VERSION_CODE="$(apkanalyzer manifest version-code "$APK")"
          VERSION_NAME="$(apkanalyzer manifest version-name "$APK")"
          test "$APP_ID" = "com.bakapiano.maiscorehub.android.beta"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_CERT_SHA256="$(
            "$APKSIGNER" verify --print-certs "$APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          )"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          sha256sum "$APK" | tee "${APK}.sha256"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "application_id=${APP_ID}"
            echo "version_code=${VERSION_CODE}"
            echo "version_name=${VERSION_NAME}"
            echo "certificate_sha256=${ACTUAL_CERT_SHA256}"
          } > "app/build/outputs/apk/beta/build-info.txt"

      - name: Generate signed release manifest
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/maiscorehub-beta.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_BETA_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_BETA_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_BETA_KEY_PASSWORD }}
          INPUT_MANDATORY: ${{ inputs.mandatory }}
          INPUT_ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/beta/MaiScoreHub-beta.apk"
          VERSION_CODE="$(apkanalyzer manifest version-code "$APK")"
          VERSION_NAME="$(apkanalyzer manifest version-name "$APK")"
          RELEASE_ID="android-beta-${VERSION_CODE}-${GITHUB_SHA:0:12}"
          APK_URL="https://api.maiscorehub.bakapiano.com/api/v1/android/app/releases/${RELEASE_ID}/apk"
          NOTES_FILE="$RUNNER_TEMP/android-release-notes.txt"
          if [ -n "${INPUT_NOTES:-}" ]; then
            printf '%s' "$INPUT_NOTES" > "$NOTES_FILE"
          else
            printf 'MaiScoreHub Beta %s' "$VERSION_NAME" > "$NOTES_FILE"
          fi
          java scripts/SignReleaseManifest.java \
            --apk "$APK" \
            --output "app/build/outputs/apk/beta/release-publish.json" \
            --release-id "$RELEASE_ID" \
            --channel beta \
            --package-name com.bakapiano.maiscorehub.android.beta \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --required-bridge-api-version 2 \
            --min-sdk 26 \
            --apk-url "$APK_URL" \
            --mandatory "${INPUT_MANDATORY:-false}" \
            --rollout-percent "${INPUT_ROLLOUT_PERCENT:-100}" \
            --notes-file "$NOTES_FILE"

      - name: Publish signed Beta release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          API_SHARED_SECRET: ${{ secrets.API_SHARED_SECRET }}
        run: |
          set -euo pipefail
          test -n "$API_SHARED_SECRET"
          PUBLISH_JSON="app/build/outputs/apk/beta/release-publish.json"
          APK="app/build/outputs/apk/beta/MaiScoreHub-beta.apk"
          RELEASE_ID="$(jq -r '.manifest.releaseId' "$PUBLISH_JSON")"
          jq -c '.policy' "$PUBLISH_JSON" > "$RUNNER_TEMP/android-policy.json"
          jq -c '.envelope' "$PUBLISH_JSON" > "$RUNNER_TEMP/android-envelope.json"
          curl --fail-with-body --retry 3 \
            -X PUT \
            -H "X-API-Secret: $API_SHARED_SECRET" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/android-policy.json" \
            "https://api.maiscorehub.bakapiano.com/api/v1/admin/android/app/releases/policies/beta"
          curl --fail-with-body --retry 3 \
            -X PUT \
            -H "X-API-Secret: $API_SHARED_SECRET" \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary "@$APK" \
            "https://api.maiscorehub.bakapiano.com/api/v1/admin/android/app/releases/${RELEASE_ID}/apk"
          curl --fail-with-body --retry 3 \
            -X PUT \
            -H "X-API-Secret: $API_SHARED_SECRET" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/android-envelope.json" \
            "https://api.maiscorehub.bakapiano.com/api/v1/admin/android/app/releases/${RELEASE_ID}"
          curl --fail-with-body \
            "https://api.maiscorehub.bakapiano.com/api/v1/android/app/releases/${RELEASE_ID}/manifest" \
            | jq -e '.signatureAlgorithm == "SHA256withRSA"' >/dev/null

      - name: Upload Beta APK
        uses: actions/upload-artifact@v7
        with:
          name: MaiScoreHub-beta
          path: |
            android-app/app/build/outputs/apk/beta/MaiScoreHub-beta.apk
            android-app/app/build/outputs/apk/beta/MaiScoreHub-beta.apk.sha256
            android-app/app/build/outputs/apk/beta/build-info.txt
            android-app/app/build/outputs/apk/beta/release-publish.json
          if-no-files-found: error
          retention-days: 30
