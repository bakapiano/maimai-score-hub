services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Cap WiredTiger cache so mongo stays well under 2GB RSS even at
    # peak. Default formula gives ~(RAM-1)/2 = 3.3GB on Server 3 which
    # has only 7.7GB total — kernel OOM-killed mongod on 2026-05-14
    # because backend×2 + nginx + frontend + mongo crowded each other
    # out. Cache is the dominant heap chunk; 1.5GB still fast for our
    # 9.5GB working set since most reads are recent jobs (well-cached).
    command:
      - mongod
      - --wiredTigerCacheSizeGB=1.5
    deploy:
      resources:
        limits:
          # Hard ceiling so the kernel never has to make the choice for us.
          # 2GB cache + 0.5GB connection/index/etc overhead.
          memory: 2.5G
        reservations:
          memory: 1G
    # Same limit for legacy compose (no swarm) — `deploy` is ignored
    # outside swarm mode but mem_limit takes effect for plain compose.
    mem_limit: 2.5g
    mem_reservation: 1g
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Wait up to 60s for in-flight requests to drain on SIGTERM
    # (NestJS enableShutdownHooks closes the http server but lets
    # active connections finish).
    stop_grace_period: 60s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9050/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      PORT: ${PORT:-9050}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-maimai_web}
      MONGO_USER: ${MONGO_USER:-root}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-example}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      MUSIC_DATA_URL: ${MUSIC_DATA_URL:-https://www.diving-fish.com/api/maimaidxprober/music_data}
      MUSIC_SYNC_CRON: ${MUSIC_SYNC_CRON:-0 */6 * * *}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./covers:/app/backend/covers

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./covers:/covers:ro

volumes:
  mongo_data:
