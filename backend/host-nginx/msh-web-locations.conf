root /var/lib/maimai-score-hub-web/frontend-current;
index index.html;
client_max_body_size 50m;

location = /api/music {
    include /etc/nginx/snippets/msh-proxy-params.conf;
    proxy_cache msh_api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 1h;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
}

location = /api {
    include /etc/nginx/snippets/msh-proxy-params.conf;
}

location ^~ /api/ {
    include /etc/nginx/snippets/msh-proxy-params.conf;
}

location = /admin {
    return 301 /admin/;
}

location ^~ /admin/assets/ {
    root /var/lib/maimai-score-hub-web/admin-current;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ^~ /admin/ {
    root /var/lib/maimai-score-hub-web/admin-current;
    try_files $uri $uri/ /admin/index.html;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

location = /sw.js {
    default_type application/javascript;
    expires -1;
    add_header Cache-Control "no-cache";
}

location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ^~ /maimai-mobile/img/ {
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    set $maimai_upstream "maimai.wahlap.com";
    proxy_pass https://$maimai_upstream;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host maimai.wahlap.com;
    proxy_set_header Referer https://maimai.wahlap.com/;
    proxy_cache msh_image_cache;
    proxy_cache_key "$request_uri";
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
