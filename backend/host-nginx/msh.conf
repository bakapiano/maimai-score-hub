upstream msh_backend {
    server 127.0.0.1:8090;
    keepalive 64;
}

server {
    listen 80;
    server_name
        api.maiscorehub.bakapiano.com
        maiscorehub.bakapiano.com
        maimai.bakapiano.com;

    location /.well-known/acme-challenge/ {
        root /var/lib/maimai-score-hub/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.maiscorehub.bakapiano.com;

    ssl_certificate /etc/maimai-score-hub/tls/api.maiscorehub.bakapiano.com/fullchain.pem;
    ssl_certificate_key /etc/maimai-score-hub/tls/api.maiscorehub.bakapiano.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_API:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50m;

    location = /api/music {
        include /etc/nginx/snippets/msh-proxy-params.conf;
        proxy_cache msh_api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    location / {
        include /etc/nginx/snippets/msh-proxy-params.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name maiscorehub.bakapiano.com;

    ssl_certificate /etc/maimai-score-hub/tls/maiscorehub.bakapiano.com/fullchain.pem;
    ssl_certificate_key /etc/maimai-score-hub/tls/maiscorehub.bakapiano.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_MAIN:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/msh-web-locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name maimai.bakapiano.com;

    ssl_certificate /etc/maimai-score-hub/tls/maimai.bakapiano.com/fullchain.pem;
    ssl_certificate_key /etc/maimai-score-hub/tls/maimai.bakapiano.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_LEGACY:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/msh-web-locations.conf;
}
