user nginx;
worker_processes auto;
worker_rlimit_nofile 65536;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    gzip on;
    gzip_static on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    brotli on;
    brotli_static on;
    brotli_min_length 1024;
    brotli_comp_level 6;
    brotli_types
        application/json
        application/javascript
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    proxy_cache_path /var/cache/nginx/msh-api
        levels=1:2
        keys_zone=msh_api_cache:10m
        max_size=256m
        inactive=24h
        use_temp_path=off;

    proxy_cache_path /var/cache/nginx/msh-images
        levels=1:2
        keys_zone=msh_image_cache:10m
        max_size=1g
        inactive=30d
        use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
