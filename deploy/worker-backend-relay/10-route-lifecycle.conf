[Unit]
# Docker can remove its iptables rules on restart. Recreate our scoped rules
# after it is available again, without coupling them to a separate oneshot.
PartOf=docker.service

[Service]
# route-on verifies API + Redis before installing the scoped DNAT rules.
# Run this after EVERY successful SSH start, including automatic reconnects.
ExecStartPost=
ExecStartPost=+/usr/local/libexec/maimai-backend-relay-control route-on
# Deliberately keep DNAT during an outage: new requests must fail closed at
# the local relay, not silently revert to the unreliable direct connection.
